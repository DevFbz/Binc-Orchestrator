<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F4F1EB"/><rect x="56" y="56" width="968" height="1238" fill="none" stroke="#D8D1C5"/>
<style>.s{font-family:Arial,Helvetica,sans-serif;fill:#17202B}.m{font-family:Consolas,monospace}.muted{fill:#68727B}.orange{fill:#D9683A}.line{stroke:#D8D1C5;stroke-width:2}.label{font-size:15px;font-weight:bold;letter-spacing:2px}.h{font-size:50px;font-weight:bold;letter-spacing:-2px}.sub{font-size:22px}.card{fill:#fff;stroke:#D8D1C5;stroke-width:2}.node{font-size:24px;font-weight:bold}.small{font-size:17px}.tiny{font-size:14px}.light{fill:#fff}.light-muted{fill:#C9D0D5}.light-soft{fill:#AEB8BF}</style>
<text x="92" y="116" class="s m label orange">BINC OS / 02 — FLUXO</text><text x="988" y="116" text-anchor="end" class="s m small muted">COMO A ORQUESTRAÇÃO ACONTECE</text><line x1="92" y1="148" x2="988" y2="148" class="line"/>
<text x="92" y="248" class="s h">Da intenção à ação</text><text x="92" y="298" class="s sub muted">O Agente BincPro interpreta o pedido, consulta o estado</text><text x="92" y="330" class="s sub muted">e aciona o projeto certo com controle de escopo.</text>
<line x1="166" y1="430" x2="166" y2="1130" stroke="#D9683A" stroke-width="5"/>
<circle cx="166" cy="460" r="22" fill="#D9683A"/><circle cx="166" cy="640" r="22" fill="#D9683A"/><circle cx="166" cy="820" r="22" fill="#D9683A"/><circle cx="166" cy="1000" r="22" fill="#D9683A"/>
<text x="218" y="440" class="s m label muted">01 / ENTRADA</text><rect x="218" y="462" width="690" height="116" class="card"/><text x="250" y="508" class="s node">Pedido do operador</text><text x="250" y="542" class="s small muted">Web, Telegram ou integração autorizada</text><text x="250" y="568" class="s tiny muted">contexto • workspace • intenção</text>
<text x="218" y="620" class="s m label muted">02 / INTERPRETAÇÃO</text><rect x="218" y="642" width="690" height="116" class="card"/><text x="250" y="688" class="s node">Agente BincPro</text><text x="250" y="722" class="s small muted">entende a intenção e identifica o domínio</text><text x="250" y="748" class="s tiny muted">sem executar fora do escopo recebido</text>
<text x="218" y="800" class="s m label muted">03 / DECISÃO</text><rect x="218" y="822" width="690" height="116" class="card"/><text x="250" y="868" class="s node">Control plane Binc OS</text><text x="250" y="902" class="s small muted">valida sessão, RBAC, projeto e confirmação</text><text x="250" y="928" class="s tiny muted">contrato server-side • idempotência</text>
<text x="218" y="980" class="s m label muted">04 / EXECUÇÃO + RETORNO</text><rect x="218" y="1002" width="690" height="116" fill="#17202B"/><text x="250" y="1048" class="s light node">Projeto executa. BincPro lê de volta.</text><text x="250" y="1082" class="s light-muted small">resultado, saúde e auditoria voltam ao operador</text><text x="250" y="1108" class="s light-soft tiny">ação comprovada — não apenas “solicitada”</text>
<text x="92" y="1252" class="s m tiny muted">02 / 04</text><text x="988" y="1252" text-anchor="end" class="s m tiny muted">BINC OS — OPERAR COM EVIDÊNCIA</text>
</svg>