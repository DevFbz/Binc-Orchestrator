<style>.sans{font-family:Arial,Helvetica,sans-serif;fill:#17202B}.mono{font-family:Consolas,monospace}.muted{fill:#68727B}.orange{fill:#D9683A}.line{stroke:#D8D1C5;stroke-width:2}.small{font-size:18px}.body{font-size:25px;line-height:1.4}.label{font-size:15px;font-weight:bold;letter-spacing:2px}.title{font-size:70px;font-weight:bold;letter-spacing:-3px}.sub{font-size:31px;line-height:1.3}.tiny{font-size:14px}.light{fill:#fff}.light-muted{fill:#C9D0D5}.light-soft{fill:#AEB8BF}</style>
<text x="92" y="116" class="sans mono label orange">BINC OS / 01 — VISÃO</text><text x="988" y="116" text-anchor="end" class="sans mono small muted">CARROSSEL • 2026</text>
<line x1="92" y1="148" x2="988" y2="148" class="line"/>
<text x="92" y="292" class="sans title">Um sistema para</text><text x="92" y="368" class="sans title">orquestrar sistemas.</text>
<text x="94" y="452" class="sans sub">O Binc OS conecta operação, projetos e evidências</text><text x="94" y="492" class="sans sub">em um único control plane.</text>
<rect x="92" y="584" width="896" height="320" fill="#17202B"/>
<circle cx="164" cy="654" r="28" fill="#D9683A"/><text x="164" y="665" text-anchor="middle" class="sans light" font-size="28" font-weight="bold">B</text>
<text x="220" y="650" class="sans light" font-size="38" font-weight="bold">Agente BincPro</text><text x="220" y="686" class="sans light-muted" font-size="19">agente de IA operacional do Binc OS</text>
<line x1="128" y1="748" x2="952" y2="748" stroke="#47525D"/>
<text x="128" y="798" class="sans light" font-size="23">interpreta</text><text x="390" y="798" class="sans light" font-size="23">coordena</text><text x="650" y="798" class="sans light" font-size="23">governa</text>
<text x="128" y="840" class="sans light-soft" font-size="17">contexto operacional</text><text x="390" y="840" class="sans light-soft" font-size="17">ações entre projetos</text><text x="650" y="840" class="sans light-soft" font-size="17">permissões e evidências</text>
<path d="M128 865H270M390 865H532M650 865H792" stroke="#D9683A" stroke-width="4"/>
<text x="92" y="1020" class="sans label muted">A IDEIA CENTRAL</text><text x="92" y="1070" class="sans body">O Binc OS não substitui os projetos.</text><text x="92" y="1110" class="sans body">Ele cria uma camada segura para operar</text><text x="92" y="1150" class="sans body">cada domínio sem perder contexto.</text>
<text x="92" y="1252" class="sans mono tiny muted">01 / 04</text><text x="988" y="1252" text-anchor="end" class="sans mono tiny muted">BINC OS — CONTROL PLANE MULTI-PROJETO</text>
