<text x="92" y="248" class="s h">IA com responsabilidade</text><text x="92" y="298" class="s sub muted">O Agente BincPro acelera decisões sem criar uma caixa-preta.</text><text x="92" y="330" class="s sub muted">Cada ação tem escopo, dono, registro e retorno verificável.</text>
