<rect x="92" y="636" width="258" height="108" class="card"/><text x="221" y="676" text-anchor="middle" class="s" font-size="23" font-weight="bold">Confirmação</text><text x="221" y="710" text-anchor="middle" class="s small muted">antes da mutação</text>
<rect x="730" y="636" width="258" height="108" class="card"/><text x="859" y="676" text-anchor="middle" class="s" font-size="23" font-weight="bold">Idempotência</text><text x="859" y="710" text-anchor="middle" class="s small muted">sem duplicar efeitos</text>
