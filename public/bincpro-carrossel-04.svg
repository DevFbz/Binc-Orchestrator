<style>.s{font-family:Arial,Helvetica,sans-serif;fill:#17202B}.m{font-family:Consolas,monospace}.muted{fill:#68727B}.orange{fill:#D9683A}.line{stroke:#D8D1C5;stroke-width:2}.label{font-size:15px;font-weight:bold;letter-spacing:2px}.h{font-size:50px;font-weight:bold;letter-spacing:-2px}.sub{font-size:22px}.small{font-size:18px}.tiny{font-size:14px}.light{fill:#fff}.light-muted{fill:#C9D0D5}.light-soft{fill:#AEB8BF}.card{fill:#fff;stroke:#D8D1C5;stroke-width:2}</style>
